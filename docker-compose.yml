services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
    #  <host_port>:<container_port> (Host port port outside of Docker conteiner)
      - "8080:80"
    volumes:
      - .:/frontend/app
      - /app/node_modules
    depends_on:
      - api
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"            # host:container
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - backend_data:/app/data
    # Uses CMD from Dockerfile:
    # CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]


  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
    driver: local
  backend_data:

