server {
  listen 80;
  server_name _;

  # serve the Vite build output
  root /usr/share/nginx/html;
  index index.html;

  # ========= API proxy =========
  # all requests starting with /api will be forwarded to the FastAPI container
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ========= SPA fallback =========
  # if a route isn't found as a file, send it to index.html (for React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
