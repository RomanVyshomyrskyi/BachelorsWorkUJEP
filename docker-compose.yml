services:
  frontenc:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
    #  <host_port>:<container_port> (Host port port outside of Docker conteiner)
      - "8080:80"
    volumes:
      - .:/frontend/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"            # host:container
    environment:
      PYTHONUNBUFFERED: "1"
    # Uses CMD from Dockerfile:
    # CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
