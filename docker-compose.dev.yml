version: '3.8'
services:
  # Production-simulated network services
  mssql_prod:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "Your_strong_P@ssw0rd!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - prod_net

  mariadb_prod:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: demo
    ports:
      - "3307:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    networks:
      - prod_net

  mongo_prod:
    image: mongo:5
    ports:
      - "27018:27017"
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - prod_net

  # SQLite is file-based; provide a tiny container that populates a file and keeps the volume alive.
  sqlite_prod:
    image: alpine
    command: ["sh","-c","mkdir -p /data && touch /data/prod_superset.db && tail -f /dev/null"]
    volumes:
      - prod_sqlite_data:/data
    networks:
      - prod_net

  # Superset built from the local Superset repository to simulate a 'production' instance that lives in the prod network
  superset_prod:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: superset:local-prod
    environment:
      # Superset metadata DB for the service (change if you want Postgres/MariaDB metadata)
      SUPERSET_SQLALCHEMY_CONN: sqlite:////var/lib/superset/prod_superset.db
      SUPERSET_ENV: production
      # Pass SECRET from host (.env) into the container
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
    volumes:
      - prod_sqlite_data:/var/lib/superset
    ports:
      - "8088:8088"
    depends_on:
      - mariadb_prod
      - mssql_prod
      - mongo_prod
      - sqlite_prod
    networks:
      - prod_net


  # Development-simulated network services (same DB types but isolated in a second network)
  mssql_dev:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "Your_strong_P@ssw0rd!"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    networks:
      - dev_net

  mariadb_dev:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: demo
    ports:
      - "3309:3306"
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    networks:
      - dev_net

  mongo_dev:
    image: mongo:5
    ports:
      - "27019:27017"
    volumes:
      - mongo_dev_data:/data/db
    networks:
      - dev_net

  sqlite_dev:
    image: alpine
    command: ["sh","-c","mkdir -p /data && touch /data/dev_superset.db && tail -f /dev/null"]
    volumes:
      - dev_sqlite_data:/data
    networks:
      - dev_net

  # Superset built from local sources for development/testing; mounts the repo for quicker iteration
  superset_dev:
    build:
      context: ./superset
      dockerfile: Dockerfile
    image: superset:local-dev
    environment:
      SUPERSET_SQLALCHEMY_CONN: sqlite:////var/lib/superset/dev_superset.db
      SUPERSET_ENV: development
      # Pass SECRET from host (.env) into the container
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
    volumes:
      - dev_sqlite_data:/var/lib/superset
      # mount the repository so you can edit locally and rebuild quickly
      - ./superset:/app/superset:cached
    ports:
      - "8089:8088"
    depends_on:
      - mariadb_dev
      - mssql_dev
      - mongo_dev
      - sqlite_dev
    networks:
      - dev_net

networks:
  prod_net:
    driver: bridge
  dev_net:
    driver: bridge

volumes:
  mariadb_prod_data:
  mariadb_dev_data:
  mongo_prod_data:
  mongo_dev_data:
  prod_sqlite_data:
  dev_sqlite_data:
