server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(get_dashboard_expert_info|check_dashboard_import_ready|validate_export_file|list_superset_servers|list_dashboards|get_server_configs_json|get_server_configs_full|export_dashboard|import_dashboard) {
        proxy_pass http://supeset-db-analitcs:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
